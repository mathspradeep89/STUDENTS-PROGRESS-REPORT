<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Internal Mark Portal</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:linear-gradient(135deg,#0f172a,#1e293b);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      color:white;
    }

    .container{
      width:100%;
      max-width:900px;
      background:white;
      color:#111827;
      border-radius:20px;
      padding:30px;
      box-shadow:0 10px 30px rgba(0,0,0,0.3);
    }

    h1{
      text-align:center;
      margin-bottom:25px;
      color:#0f172a;
    }

    .search-box{
      display:flex;
      gap:10px;
      margin-bottom:30px;
    }

    input{
      flex:1;
      padding:14px;
      border-radius:10px;
      border:1px solid #cbd5e1;
      font-size:16px;
    }

    button{
      padding:14px 25px;
      border:none;
      background:#2563eb;
      color:white;
      border-radius:10px;
      cursor:pointer;
      font-size:16px;
      transition:0.3s;
    }

    button:hover{
      background:#1d4ed8;
    }

    .card{
      display:none;
      grid-template-columns:250px 1fr;
      gap:30px;
      align-items:center;
      background:#f8fafc;
      padding:25px;
      border-radius:20px;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
    }

    .photo-section{
      text-align:center;
    }

    .photo-section img{
      width:220px;
      height:220px;
      object-fit:cover;
      border-radius:15px;
      border:5px solid #2563eb;
    }

    .details h2{
      margin-bottom:15px;
      color:#1e293b;
    }

    .details p{
      margin:10px 0;
      font-size:18px;
    }

    .mark{
      font-weight:bold;
      color:#2563eb;
    }

    .error{
      text-align:center;
      color:red;
      margin-top:15px;
      font-weight:bold;
    }

    @media(max-width:768px){
      .card{
        grid-template-columns:1fr;
        text-align:center;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Internal Mark Portal</h1>

  <div class="search-box">
    <input type="text" id="rollNo" placeholder="Enter Register Number">
    <button onclick="searchStudent()">Search</button>
  </div>

  <div class="card" id="studentCard">

    <div class="photo-section">
      <img id="studentPhoto" src="" alt="Student Photo">
    </div>

    <div class="details">
      <h2 id="studentName"></h2>

      <p><strong>Register Number:</strong> <span id="studentReg"></span></p>
      <p><strong>Department:</strong> IT</p>

      <p><strong>IA-I Total:</strong> <span class="mark" id="ia1"></span></p>
      <p><strong>IA-II Total:</strong> <span class="mark" id="ia2"></span></p>
      <p><strong>Total Mark:</strong> <span class="mark" id="total"></span></p>
      <p><strong>Final CIA Mark:</strong> <span class="mark" id="cia"></span> / 40</p>
    </div>

  </div>

  <div class="error" id="error"></div>

</div>

<script>

/*
=====================================================
PHOTO STORAGE IN LOCAL FOLDER
=====================================================

Create folder structure:

project-folder/
    index.html
    photos/
        711725UIT101.jpg
        711725UIT102.jpg
        711725UIT103.jpg
        etc...

Photo name MUST match Register Number
*/

const students = {

  "711725UIT101": {
    name: "AAKASH KUMAR P",
    ia1: 87,
    ia2: 73,
    total: 160,
    cia: 32
  },

  "711725UIT102": {
    name: "AARTHY M J",
    ia1: 65,
    ia2: 67,
    total: 132,
    cia: 26
  },

  "711725UIT103": {
    name: "ABINAYA SREE M",
    ia1: 85,
    ia2: 85,
    total: 170,
    cia: 34
  },

  "711725UIT109": {
    name: "ANUSIYA M",
    ia1: 98,
    ia2: 96,
    total: 194,
    cia: 39
  },

  "711725UIT142": {
    name: "KALAIVANI V",
    ia1: 98,
    ia2: 100,
    total: 198,
    cia: 40
  },

  "711725UIT151": {
    name: "KOKILA M",
    ia1: 87,
    ia2: 83,
    total: 170,
    cia: 34
  }

};

function searchStudent(){

  const roll = document.getElementById("rollNo").value.trim();
  const student = students[roll];

  const card = document.getElementById("studentCard");
  const error = document.getElementById("error");

  if(student){

    card.style.display = "grid";
    error.innerHTML = "";

    document.getElementById("studentName").innerHTML = student.name;
    document.getElementById("studentReg").innerHTML = roll;

    document.getElementById("ia1").innerHTML = student.ia1;
    document.getElementById("ia2").innerHTML = student.ia2;
    document.getElementById("total").innerHTML = student.total;
    document.getElementById("cia").innerHTML = student.cia;

    // Local Drive Photo
    document.getElementById("studentPhoto").src =
      "photos/" + roll + ".jpg";

  }
  else{

    card.style.display = "none";
    error.innerHTML = "Student Record Not Found";

  }
}

</script>

</body>
</html>
