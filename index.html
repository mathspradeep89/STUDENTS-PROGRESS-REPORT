<title>Student Internal Mark Portal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:900px;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

h1{
    text-align:center;
    margin-bottom:25px;
    color:#0f172a;
}

.search-box{
    display:flex;
    gap:10px;
    margin-bottom:30px;
}

input{
    flex:1;
    padding:14px;
    border-radius:10px;
    border:1px solid #cbd5e1;
    font-size:16px;
}

button{
    padding:14px 25px;
    border:none;
    background:#2563eb;
    color:white;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

.card{
    display:none;
    grid-template-columns:250px 1fr;
    gap:30px;
    align-items:center;
    background:#f8fafc;
    padding:25px;
    border-radius:20px;
}

.photo-section{
    text-align:center;
}

.photo-section img{
    width:220px;
    height:220px;
    object-fit:cover;
    border-radius:15px;
    border:5px solid #2563eb;
}

.details h2{
    margin-bottom:15px;
    color:#1e293b;
}

.details p{
    margin:10px 0;
    font-size:18px;
}

.mark{
    color:#2563eb;
    font-weight:bold;
}

.error{
    text-align:center;
    color:red;
    margin-top:15px;
    font-weight:bold;
}

@media(max-width:768px){

.card{
    grid-template-columns:1fr;
    text-align:center;
}

}

</style>
</head>

function searchStudent(){

const roll = document
.getElementById("rollNo")
.value
.trim()
.toUpperCase();

const student = students[roll];

const card = document.getElementById("studentCard");
const error = document.getElementById("error");

if(student){

card.style.display = "grid";

error.innerHTML = "";

document.getElementById("studentName").innerHTML =
student.name;

document.getElementById("studentReg").innerHTML =
roll;

document.getElementById("ia1").innerHTML =
student.ia1;

document.getElementById("ia2").innerHTML =
student.ia2;

document.getElementById("total").innerHTML =
student.total;

document.getElementById("cia").innerHTML =
student.cia;

document.getElementById("studentPhoto").src =
student.photo;

}
else{

card.style.display = "none";

error.innerHTML = "Student Record Not Found";

}

}
